<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learner interview recorder</title><style>
:root{color-scheme:dark;font-family:system-ui,'Segoe UI',sans-serif;color:#eaf4fc;background:#0c1725}*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(ellipse at 10% 0,#183c55,transparent 65%),#0c1725}.recorder{max-width:1100px;margin:auto;background:#142536;border:1px solid #486075;border-radius:18px;box-shadow:0 16px 45px #0005;overflow:hidden}.heading{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 22px;border-bottom:1px solid #345064;background:#172d40}.heading h1{font-size:19px;margin:0;letter-spacing:-.2px}.eyebrow{font-size:10px;letter-spacing:.14em;font-weight:800;color:#8aafc7;margin-bottom:4px}.badge{display:flex;align-items:center;gap:8px;border:1px solid #5d7688;border-radius:30px;padding:6px 12px;font-size:11px;font-weight:800;white-space:nowrap}.lamp{width:8px;height:8px;border-radius:50%;background:#9db3c1;box-shadow:0 0 0 4px #9db3c114}body[data-mode="recording"] .lamp{background:#ff797e;box-shadow:0 0 0 4px #ff797e20;animation:pulse 1.3s infinite}body[data-mode="recording"] .badge{color:#ffd4d7;border-color:#b76672}body[data-mode="ready"] .lamp{background:#72e0b2}.content{padding:18px 22px}.context{display:flex;gap:20px;align-items:flex-start;justify-content:space-between}.learner{font-size:13px;font-weight:800;color:#9fdbed;margin:0 0 6px}#question{font-size:20px;font-weight:750;line-height:1.4;margin:0;max-width:72ch}.timebox{text-align:right;flex:none}#timer{font-size:34px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:1px}.limit{font-size:10px;color:#96b3c8;margin-top:6px}.scope{position:relative;height:103px;margin:17px 0 15px;border:1px solid #36576e;border-radius:12px;overflow:hidden;background:#091725}.scope canvas{display:block;width:100%;height:100%}.scope-label{position:absolute;left:12px;top:9px;font-size:9px;font-weight:800;letter-spacing:.12em;color:#8aaabe;pointer-events:none}.remaining{margin:-4px 0 14px}.remaining-label{display:flex;justify-content:space-between;margin-bottom:6px;font-size:11px;color:#b6cddd}.meter{height:14px;background:#091725;border:1px solid #36576e;border-radius:8px;overflow:hidden}.meter span{display:block;width:100%;height:100%;background:#72dfb2;transition:width .25s linear,background-color .3s}.meter[data-warning="amber"] span{background:#f6bc54}.meter[data-warning="red"] span{background:#ff747e}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.transport{display:flex;gap:8px;align-items:center}.control{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:43px;padding:10px 15px;border:1px solid #64899f;border-radius:9px;background:linear-gradient(#2b4d63,#203c51);box-shadow:inset 0 1px #ffffff18,0 3px 7px #0003;color:#eff8ff;font:750 13px/1.3 system-ui;text-decoration:none;cursor:pointer;transition:filter .12s,transform .12s}.control:hover:not(:disabled){filter:brightness(1.18);transform:translateY(-1px)}.control:active:not(:disabled){transform:translateY(1px)}.control:focus-visible,#seek:focus-visible{outline:3px solid #99e5ef;outline-offset:3px}.control:disabled{opacity:.38;cursor:default;box-shadow:none}.control svg{width:18px;height:18px;flex:none;fill:currentColor}.record{background:linear-gradient(#82434e,#63313b);border-color:#ce8690}.stop{background:linear-gradient(#496073,#344a5b)}.use{background:linear-gradient(#24735c,#175441);border-color:#74d1b0;margin-left:auto}.discard{background:#302f3a;border-color:#937582;color:#e8c9d1}.playback{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:14px;background:#0c1e2e;border:1px solid #405e73;border-radius:11px}.playback[hidden]{display:none}#play{width:43px;padding:10px;border-radius:50%}#seek{flex:1;min-width:80px;accent-color:#75d9ca;cursor:pointer}#playTime{font-size:11px;white-space:nowrap;color:#c8dbe7;font-variant-numeric:tabular-nums}.footer{display:flex;align-items:center;gap:16px;justify-content:space-between;border-top:1px solid #345064;padding:10px 22px;font-size:11px;color:#9bb5c8}#status{margin:0;line-height:1.45;flex:1}#download{font-size:11px;color:#b0d8e8;white-space:nowrap}.caption{font-size:10px;opacity:.8}.control[hidden],[hidden]{display:none!important}@keyframes pulse{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:650px){body{padding:9px}.heading,.content{padding:14px}.context{gap:10px}#question{font-size:16px}#timer{font-size:27px}.scope{height:85px}.control{font-size:12px;padding:9px 11px}.use{margin-left:0}.footer{padding:10px 14px;flex-wrap:wrap}.heading h1{font-size:16px}}@media(max-height:560px) and (min-width:651px){body{padding:9px}.heading{padding:10px 18px}.content{padding:12px 18px}.scope{height:78px;margin:12px 0}.footer{padding:8px 18px}#question{font-size:18px}}
</style></head><body data-mode="connecting"><main class="recorder"><header class="heading"><div><div class="eyebrow">Learner voice · audio capture</div><h1>Interview recorder</h1></div><div class="badge"><span class="lamp" aria-hidden="true"></span><span id="modeLabel">Connecting</span></div></header><section class="content"><div class="context"><div><p id="learner" class="learner">Connecting to the interview window…</p><p id="question"></p></div><div class="timebox"><div id="timer" aria-label="Recording duration">00:00</div><div class="limit">5 minute maximum</div></div></div><div class="scope"><span id="scopeLabel" class="scope-label">MICROPHONE · LIVE WAVEFORM</span><canvas id="waveform" aria-label="Live microphone audio waveform" role="img"></canvas></div><div class="remaining"><div class="remaining-label"><span>Recording time remaining</span><span id="remainingTime">05:00</span></div><div id="remainingMeter" class="meter" role="progressbar" aria-label="Recording time remaining" aria-valuemin="0" aria-valuemax="300" aria-valuenow="300" aria-valuetext="5 minutes remaining"><span id="remainingFill"></span></div></div><div id="playback" class="playback" hidden><button id="play" class="control" aria-label="Play recording"></button><span id="playTime">00:00 / 00:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Playback position"><audio id="preview" preload="metadata"></audio></div><nav class="controls" aria-label="Recording controls"><div class="transport"><button id="start" class="control record" disabled></button><button id="stop" class="control stop" disabled></button></div><button id="discard" class="control discard" disabled></button><button id="use" class="control use" disabled></button></nav></section><footer class="footer"><p id="status" role="status">Audio stays on this device until you return it to the interview window.</p><a id="download" hidden>Download a copy</a></footer></main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),token=new URLSearchParams(location.hash.slice(1)).get('token')||'';
const icons={record:'<circle cx="12" cy="12" r="7"/>',stop:'<rect x="5" y="5" width="14" height="14" rx="2"/>',play:'<path d="M7 4L21 12L7 20Z"/>',pause:'<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>',discard:'<path d="M6 7H18L17 21H7ZM9 2H15L16 5H20V7H4V5H8Z"/>',use:'<path d="M3 12L8 17L21 4L23 6L8 21L1 14Z"/>'};
function icon(name){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[name]+'</svg>'}function button(id,name,label){$(id).innerHTML=icon(name)+'<span>'+label+'</span>'}
button('start','record','Start recording');button('stop','stop','Stop');button('discard','discard','Discard recording');button('use','use','Use recording');$('play').innerHTML=icon('play');
let origin='',context=null,recorder=null,stream=null,chunks=[],blob=null,url='',timer=null,startTime=0,bytes=0,duration=0,starting=false,audioContext=null,analyser=null,source=null,animation=null,discardOnStop=false,sent=false;
const canvas=$('waveform'),drawing=canvas.getContext('2d');
function send(type,extra={}){if(window.opener&&origin)window.opener.postMessage({type,token,...extra},origin)}
function time(n){n=Math.max(0,Math.floor(Number(n)||0));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function remaining(elapsed){const seconds=Math.max(0,Math.min(300,300-elapsed)),meter=$('remainingMeter');$('remainingFill').style.width=(seconds/300*100)+'%';meter.dataset.warning=seconds<=30?'red':seconds<=60?'amber':'green';meter.setAttribute('aria-valuenow',Math.ceil(seconds));meter.setAttribute('aria-valuetext',time(Math.ceil(seconds))+' remaining');$('remainingTime').textContent=time(Math.ceil(seconds))}
function mode(value,label){document.body.dataset.mode=value;$('modeLabel').textContent=label}
function dimensions(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));drawing.setTransform(dpr,0,0,dpr,0,0);return {width:r.width,height:r.height}}
function grid(w,h){drawing.clearRect(0,0,w,h);drawing.strokeStyle='#244156';drawing.lineWidth=.6;drawing.beginPath();for(let x=0;x<w;x+=32){drawing.moveTo(x,0);drawing.lineTo(x,h)}for(let y=h/2%22;y<h;y+=22){drawing.moveTo(0,y);drawing.lineTo(w,y)}drawing.stroke()}
function idleWave(){if(!drawing)return;const {width:w,height:h}=dimensions();grid(w,h);drawing.strokeStyle='#577d91';drawing.lineWidth=1.5;drawing.beginPath();drawing.moveTo(0,h/2);drawing.lineTo(w,h/2);drawing.stroke();}
function liveWave(){if(!analyser||!drawing)return;const data=new Uint8Array(analyser.fftSize);function frame(){if(!analyser)return;const {width:w,height:h}=dimensions();grid(w,h);analyser.getByteTimeDomainData(data);drawing.beginPath();for(let i=0;i<data.length;i++){const v=(data[i]-128)/128;const x=i/(data.length-1)*w,y=h/2+v*(h*.43);if(i===0)drawing.moveTo(x,y);else drawing.lineTo(x,y)}drawing.strokeStyle='#79e5d2';drawing.lineWidth=2;drawing.shadowColor='#65decc';drawing.shadowBlur=5;drawing.stroke();drawing.shadowBlur=0;animation=requestAnimationFrame(frame)}frame()}
async function analyse(mic){try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;audioContext=new Audio();if(audioContext.state==='suspended')await audioContext.resume();source=audioContext.createMediaStreamSource(mic);analyser=audioContext.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.65;source.connect(analyser);liveWave()}catch(e){$('scopeLabel').textContent='MICROPHONE RECORDING · VISUALISER UNAVAILABLE';idleWave()}}
function stopTracks(){stream?.getTracks().forEach(t=>t.stop());stream=null;clearInterval(timer);if(animation!=null)cancelAnimationFrame(animation);animation=null;try{source?.disconnect()}catch(e){}source=null;analyser=null;if(audioContext){audioContext.close().catch(()=>{});audioContext=null}idleWave()}
function clearClip(){const player=$('preview');player.pause();player.removeAttribute('src');player.load();if(url)URL.revokeObjectURL(url);url='';blob=null;chunks=[];duration=0;bytes=0;sent=false;$('playback').hidden=true;$('download').hidden=true;$('use').disabled=true;$('discard').disabled=true;$('timer').textContent='00:00';remaining(0);$('seek').value='0';$('play').innerHTML=icon('play');$('play').setAttribute('aria-label','Play recording');button('start','record','Start recording');$('scopeLabel').textContent='MICROPHONE · LIVE WAVEFORM';idleWave()}
function error(e){stopTracks();starting=false;$('start').disabled=!context;$('stop').disabled=true;$('discard').disabled=!blob;mode('error','Microphone unavailable');$('status').textContent=e?.name==='NotAllowedError'?'Microphone access was denied. Allow microphone access for this recorder address and try again.':e?.message||String(e)}
async function start(){if(starting||recorder?.state==='recording')return;if(blob&&!sent&&!confirm('Discard this recording and record a new response?'))return;clearClip();starting=true;$('start').disabled=true;mode('connecting','Connecting microphone');$('status').textContent='Requesting microphone access…';
try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('This browser does not support microphone recording.');stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});const mime=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,{...(mime?{mimeType:mime}:{}),audioBitsPerSecond:64000});chunks=[];bytes=0;discardOnStop=false;
recorder.ondataavailable=e=>{if(e.data.size){chunks.push(e.data);bytes+=e.data.size;if(bytes>9*1024*1024&&recorder.state==='recording')stop()}};
recorder.onerror=e=>error(e.error||e);
recorder.onstop=()=>{duration=Math.max(1,Math.round((Date.now()-startTime)/1000));stopTracks();$('stop').disabled=true;$('start').disabled=false;
if(discardOnStop){discardOnStop=false;clearClip();mode('idle','Ready to record');$('status').textContent='Recording discarded. Choose Start recording to begin again.';send('INTERVIEW_AUDIO_STATE',{state:'discarded'});return}
blob=new Blob(chunks,{type:recorder.mimeType||mime||'audio/webm'});if(!blob.size||blob.size>10*1024*1024){error(Error('The recording was empty or too large. Please record a shorter response.'));return}
url=URL.createObjectURL(blob);$('preview').src=url;$('playback').hidden=false;$('use').disabled=false;$('discard').disabled=false;$('download').href=url;$('download').download='Interview_'+new Date().toISOString().replace(/[:.]/g,'-')+'.'+(blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm');$('download').hidden=false;$('timer').textContent=time(duration);remaining(duration);$('playTime').textContent='00:00 / '+time(duration);button('start','record','Record again');mode('ready','Ready to review');$('scopeLabel').textContent='RECORDING COMPLETE · USE PLAY TO REVIEW';$('status').textContent='Listen back, then use this recording or discard it.';send('INTERVIEW_AUDIO_STATE',{state:'stopped'})};
recorder.start(1000);startTime=Date.now();starting=false;$('stop').disabled=false;$('discard').disabled=false;mode('recording','Recording');$('status').textContent='Recording live microphone audio…';send('INTERVIEW_AUDIO_STATE',{state:'recording'});analyse(stream);timer=setInterval(()=>{const n=Math.floor((Date.now()-startTime)/1000);$('timer').textContent=time(Math.min(n,300));remaining((Date.now()-startTime)/1000);if(n>=300)stop()},250);
}catch(e){error(e)}}
function stop(){if(recorder?.state==='recording'){recorder.stop();$('stop').disabled=true}}
function discard(){if(!blob&&recorder?.state!=='recording')return;if(!confirm('Discard this recording? It has not been saved to the observation.'))return;if(recorder?.state==='recording'){discardOnStop=true;stop()}else{clearClip();mode('idle','Ready to record');$('status').textContent='Recording discarded. Choose Start recording to begin again.';send('INTERVIEW_AUDIO_STATE',{state:'discarded'})}}
$('start').onclick=start;$('stop').onclick=stop;$('discard').onclick=discard;
$('play').onclick=()=>{const p=$('preview');if(p.paused)p.play().catch(error);else p.pause()};
$('preview').addEventListener('play',()=>{$('play').innerHTML=icon('pause');$('play').setAttribute('aria-label','Pause playback')});
function paused(){$('play').innerHTML=icon('play');$('play').setAttribute('aria-label','Play recording')}$('preview').addEventListener('pause',paused);$('preview').addEventListener('ended',paused);
$('preview').addEventListener('timeupdate',()=>{const p=$('preview'),total=Number.isFinite(p.duration)&&p.duration>0?p.duration:duration;$('playTime').textContent=time(p.currentTime)+' / '+time(total);$('seek').value=total?String(Math.min(1000,p.currentTime/total*1000)):'0'});
$('seek').addEventListener('input',()=>{const p=$('preview'),total=Number.isFinite(p.duration)&&p.duration>0?p.duration:duration;if(total)p.currentTime=Number($('seek').value)/1000*total});
$('use').onclick=()=>{if(!blob)return;$('preview').pause();if(!window.opener){$('status').textContent='The interview window is unavailable. Download a copy, then attach it using Choose audio in the interview window.';return}send('INTERVIEW_AUDIO_RESULT',{blob,durationSeconds:duration});sent=true;$('status').textContent='Recording returned. Save and play it in the interview window.';$('use').disabled=true;mode('sent','Returned to interview')};
window.addEventListener('message',e=>{if(e.source!==window.opener||e.data?.type!=='INTERVIEW_AUDIO_INIT'||e.data.token!==token||context)return;if(!/^https:\/\//.test(e.origin))return;origin=e.origin;context=e.data.context;$('learner').textContent=context.learnerLabel||'Learner interview';$('question').textContent=context.prompt||context.question||'';$('start').disabled=false;clearInterval(ready);mode('idle','Ready to record');$('status').textContent='Press Start recording when you and the learner are ready. Microphone access begins only then.'});
const ready=setInterval(()=>{if(!window.opener){clearInterval(ready);mode('idle','Open from an interview');$('status').textContent='Open this recorder using Record audio in the lesson observation or work-sample interview.';return}window.opener.postMessage({type:'INTERVIEW_AUDIO_READY',token},'*')},400);
// Standalone popups may resize/reposition themselves; browsers retain the final decision.
try{const width=Math.min(1080,screen.availWidth-40),height=Math.min(540,screen.availHeight-40);if(window.opener){window.resizeTo(width,height);window.moveTo((screen.availLeft||0)+(screen.availWidth-width)/2,(screen.availTop||0)+(screen.availHeight-height)/2)}}catch(e){}
window.addEventListener('resize',()=>{if(!analyser)idleWave()});window.addEventListener('beforeunload',e=>{if(recorder?.state==='recording'||blob&&!sent){e.preventDefault();e.returnValue=''}});window.addEventListener('pagehide',()=>{stopTracks();if(url)URL.revokeObjectURL(url)});idleWave();
})();
</script></body></html>
