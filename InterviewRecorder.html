<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learner interview recorder</title><style>html{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:24px;background:#10273c;color:#f1f7fc;font:16px/1.5 system-ui,sans-serif}h1{font-size:24px;margin:0 0 8px}#question{font-size:19px;font-weight:700}button,a{font:inherit;border:1px solid #8ec9e0;border-radius:9px;padding:11px 16px;background:#23586e;color:white;cursor:pointer}button:disabled{opacity:.45;cursor:default}#stop{background:#783e44}#use{background:#176046}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}audio{width:100%;margin:14px 0}#timer{font-size:38px;font-variant-numeric:tabular-nums}#status{min-height:48px;color:#c6dce9}[hidden]{display:none!important}</style></head><body><h1>Learner interview recorder</h1><p id="learner">Connecting to the interview window…</p><p id="question"></p><div id="timer">00:00</div><nav><button id="start" disabled>● Start recording</button><button id="stop" disabled>■ Stop</button></nav><p id="status" role="status">Audio stays on this device until you send it back to the interview window.</p><audio id="preview" controls hidden></audio><nav><button id="use" disabled>Use this recording</button><a id="download" hidden>Download a copy</a></nav><p>Maximum recording length: five minutes. This page does not upload or transcribe audio.</p><script>
(()=>{'use strict';const $=id=>document.getElementById(id),token=new URLSearchParams(location.hash.slice(1)).get('token')||'';let origin='',context=null,recorder=null,stream=null,chunks=[],blob=null,url='',timer=null,startTime=0,bytes=0,duration=0,starting=false;
function send(type,extra={}){if(window.opener&&origin)window.opener.postMessage({type,token,...extra},origin)}
function stopTracks(){stream?.getTracks().forEach(t=>t.stop());stream=null;clearInterval(timer)}
function error(e){stopTracks();starting=false;$('start').disabled=!context;$('stop').disabled=true;$('status').textContent=e?.name==='NotAllowedError'?'Microphone access was denied. Allow microphone access for this recorder address and try again.':e?.message||String(e)}
async function start(){if(starting||recorder?.state==='recording')return;starting=true;$('start').disabled=true;$('status').textContent='Requesting microphone access…';try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('This browser does not support microphone recording.');stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});const mime=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,{...(mime?{mimeType:mime}:{}),audioBitsPerSecond:64000});chunks=[];bytes=0;blob=null;$('use').disabled=true;$('preview').hidden=true;$('download').hidden=true;
recorder.ondataavailable=e=>{if(e.data.size){chunks.push(e.data);bytes+=e.data.size;if(bytes>9*1024*1024&&recorder.state==='recording')stop()}};
recorder.onerror=e=>error(e.error||e);
recorder.onstop=()=>{duration=Math.max(1,Math.round((Date.now()-startTime)/1000));stopTracks();blob=new Blob(chunks,{type:recorder.mimeType||mime||'audio/webm'});if(!blob.size||blob.size>10*1024*1024){error(Error('The recording was empty or too large. Please record a shorter response.'));return}if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);$('preview').src=url;$('preview').hidden=false;$('use').disabled=false;$('download').href=url;$('download').download='Interview_'+new Date().toISOString().replace(/[:.]/g,'-')+'.'+(blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm');$('download').hidden=false;$('start').disabled=false;$('start').textContent='● Record again';$('status').textContent='Listen back, then use this recording to return it to the interview window.';send('INTERVIEW_AUDIO_STATE',{state:'stopped'})};
recorder.start(1000);startTime=Date.now();starting=false;$('stop').disabled=false;$('status').textContent='Recording…';send('INTERVIEW_AUDIO_STATE',{state:'recording'});timer=setInterval(()=>{const n=Math.floor((Date.now()-startTime)/1000);$('timer').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');if(n>=300)stop()},250);
}catch(e){error(e)}}
function stop(){if(recorder?.state==='recording'){recorder.stop();$('stop').disabled=true}}
$('start').onclick=start;$('stop').onclick=stop;$('use').onclick=()=>{if(!blob)return;if(!window.opener){$('status').textContent='The interview window is unavailable. Download a copy, then attach it using Choose audio in the interview window.';return}send('INTERVIEW_AUDIO_RESULT',{blob,durationSeconds:duration});$('status').textContent='Recording returned. You can save and play it in the interview window.';$('use').disabled=true};
window.addEventListener('message',e=>{if(e.source!==window.opener||e.data?.type!=='INTERVIEW_AUDIO_INIT'||e.data.token!==token||context)return;if(!/^https:\/\//.test(e.origin))return;origin=e.origin;context=e.data.context;$('learner').textContent=context.learnerLabel||'Learner interview';$('question').textContent=context.prompt||context.question||'';$('start').disabled=false;clearInterval(ready);start()});
const ready=setInterval(()=>{if(!window.opener){clearInterval(ready);$('status').textContent='Open this recorder using Record audio in the lesson observation or work-sample interview.';return}window.opener.postMessage({type:'INTERVIEW_AUDIO_READY',token},'*')},400);
window.addEventListener('beforeunload',e=>{if(recorder?.state==='recording'){e.preventDefault();e.returnValue=''}});window.addEventListener('pagehide',()=>{stopTracks();if(url)URL.revokeObjectURL(url)});
})();
</script></body></html>
